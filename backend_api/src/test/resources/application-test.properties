# Test profile configuration - avoids requiring real datasource for OpenAPI smoke tests

# Disable datasource autoconfiguration for tests
spring.autoconfigure.exclude=\
  org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,\
  org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration,\
  org.springframework.boot.autoconfigure.data.jpa.JpaRepositoriesAutoConfiguration,\
  org.springframework.boot.autoconfigure.flyway.FlywayAutoConfiguration

# Explicitly disable Flyway (defense-in-depth) so migrations never run in tests
spring.flyway.enabled=false

# Disable SQL initialization
spring.sql.init.mode=never

# JPA settings for test environment
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false

# Logging
logging.level.org.springframework=WARN
logging.level.com.example.backendapi=INFO
