# Test configuration - disables datasource requirement for OpenAPI smoke tests

spring.application.name=backendapi

# Run on random port for tests
server.port=0

# -----------------------------
# Exclude datasource auto-configuration for tests
# -----------------------------
spring.autoconfigure.exclude=\
  org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,\
  org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration,\
  org.springframework.boot.autoconfigure.data.jpa.JpaRepositoriesAutoConfiguration,\
  org.springframework.boot.autoconfigure.flyway.FlywayAutoConfiguration

# Explicitly disable Flyway (defense-in-depth) so migrations never run in tests
spring.flyway.enabled=false

# Do not run SQL init scripts
spring.sql.init.mode=never

# JPA Configuration - disabled for tests
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false

# -----------------------------
# Actuator configuration
# -----------------------------
management.endpoints.web.exposure.include=health,info,metrics

# -----------------------------
# Swagger/OpenAPI configuration
# -----------------------------
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha

# Respect X-Forwarded-* / Forwarded headers
server.forward-headers-strategy=framework

# Logging for tests
logging.level.org.springframework=WARN
logging.level.com.example.backendapi=INFO
