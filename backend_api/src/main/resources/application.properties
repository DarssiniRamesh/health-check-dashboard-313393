spring.application.name=backendapi

# Run on the preview/runtime port.
# IMPORTANT: Ports are managed by the platform/manifest. Use the injected PORT env var.
server.port=${PORT:3002}

# -----------------------------
# Database configuration
# -----------------------------
# MANDATORY: Database credentials must be provided via environment variables.
# The orchestrator sets these in the container .env file.
#
# Required environment variables:
# - SPRING_DATASOURCE_URL      (JDBC URL for Neon Postgres)
# - SPRING_DATASOURCE_USERNAME (database user)
# - SPRING_DATASOURCE_PASSWORD (database password)
#
# Alternative: Provide DATABASE_URL in postgresql://... format.
# DatabaseUrlEnvironmentPostProcessor will convert it to JDBC format and set
# spring.datasource.* properties automatically (with sslmode=require).
#
# IMPORTANT: No localhost fallbacks. App will fail to start if credentials are missing.
# This ensures we never accidentally connect to the wrong database.
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Fail fast if datasource cannot be created (no fallback to localhost).
# This prevents the app from starting with invalid/missing DB configuration.
spring.datasource.hikari.initialization-fail-timeout=1

# -----------------------------
# Hikari / Postgres (Neon) tuning
# -----------------------------
# Neon is a remote, SSL-required Postgres. Default timeouts/validation can be too aggressive and
# lead to intermittent "HikariPool - Connection is not available" errors under transient latency.
#
# Keep the pool small for a lightweight demo API and prefer fast failure + retry instead of
# holding many long-lived connections.
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
# Send periodic keepalives so the pool doesn't hand out half-closed connections.
spring.datasource.hikari.keepalive-time=300000
# Use an explicit test query for validation (more reliable across poolers/proxies).
spring.datasource.hikari.connection-test-query=SELECT 1

# PostgreSQL JDBC driver socket/connect tuning (values are seconds for these properties).
spring.datasource.hikari.data-source-properties.connectTimeout=10
spring.datasource.hikari.data-source-properties.socketTimeout=30
spring.datasource.hikari.data-source-properties.tcpKeepAlive=true
spring.datasource.hikari.data-source-properties.applicationName=backend_api

# Do not run SQL init scripts automatically (prevents startup failures in environments
# where schema isn't present / isn't meant to be managed by Spring Boot).
spring.sql.init.mode=never

# JPA Configuration
# This service only needs raw DataSource access for a connectivity check endpoint.
# In this environment Postgres may not be available at startup; JPA/Hibernate would
# fail application startup. Disable JPA auto-config to ensure the service can start
# and still expose /health (and /status will report DOWN if DB is unreachable).
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration,org.springframework.boot.autoconfigure.data.jpa.JpaRepositoriesAutoConfiguration
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false

# -----------------------------
# Actuator configuration
# -----------------------------
management.endpoints.web.exposure.include=health,info,metrics

# -----------------------------
# Swagger/OpenAPI configuration
# -----------------------------
# Use the SpringDoc default API docs path so Swagger UI and common tooling
# (and many reverse-proxy setups) work out-of-the-box.
springdoc.api-docs.path=/v3/api-docs

# Keep the classic swagger-ui entry point (SpringDoc will serve the UI at /swagger-ui/index.html).
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha

# Respect X-Forwarded-* / Forwarded headers so redirects preserve external scheme/host/port
server.forward-headers-strategy=framework
