spring.application.name=backendapi

# -----------------------------
# Database configuration
# -----------------------------
# NOTE: These values should be provided via environment variables in production/deployment.
# The orchestrator will set them in the container .env file.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/postgres}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
# (We don't require schema generation for health checks; keep it off by default)
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false

# -----------------------------
# Actuator configuration
# -----------------------------
management.endpoints.web.exposure.include=health,info,metrics

# -----------------------------
# Swagger/OpenAPI configuration
# -----------------------------
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha

# Respect X-Forwarded-* / Forwarded headers so redirects preserve external scheme/host/port
server.forward-headers-strategy=framework
