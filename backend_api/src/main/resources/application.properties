spring.application.name=backendapi

# Run on the expected preview port
server.port=3002

# -----------------------------
# Database configuration
# -----------------------------
# NOTE: In production/deployment these should be provided via environment variables.
# The orchestrator will set them in the container .env file.
#
# IMPORTANT: Configure DB via environment variables in deployment:
# - SPRING_DATASOURCE_URL
# - SPRING_DATASOURCE_USERNAME
# - SPRING_DATASOURCE_PASSWORD
#
# We intentionally do not commit credentials into source control.
# If these are not provided, the application still starts and /status returns DOWN.
spring.datasource.url=${SPRING_DATASOURCE_URL:}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# Do not fail startup if DB is temporarily unavailable.
# (Connections will be attempted only when /status is called.)
spring.datasource.hikari.initialization-fail-timeout=-1

# JPA Configuration
# This service only needs raw DataSource access for a connectivity check endpoint.
# In this environment Postgres may not be available at startup; JPA/Hibernate would
# fail application startup. Disable JPA auto-config to ensure the service can start
# and still expose /health (and /status will report DOWN if DB is unreachable).
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration,org.springframework.boot.autoconfigure.data.jpa.JpaRepositoriesAutoConfiguration
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false

# -----------------------------
# Actuator configuration
# -----------------------------
management.endpoints.web.exposure.include=health,info,metrics

# -----------------------------
# Swagger/OpenAPI configuration
# -----------------------------
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha

# Respect X-Forwarded-* / Forwarded headers so redirects preserve external scheme/host/port
server.forward-headers-strategy=framework
